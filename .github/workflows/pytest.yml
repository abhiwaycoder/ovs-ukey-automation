name: OVS UKEY Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on:
      - self-hosted
      - ovs-ukey

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          python3 --version
          python3 -m pip --version

      - name: Install dependencies
        run: |
          python3 -m pip install --user -r requirements.txt

      - name: Run pytest
        run: |
          python3 -m pytest -v

